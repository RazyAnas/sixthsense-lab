<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SixthSense — device probe</title>
<style>
body{font:16px system-ui;background:#0d1117;color:#e6edf5;margin:0;padding:20px}
h1{font-size:20px;margin:0 0 4px}p.s{color:#8b98a8;margin:0 0 18px;font-size:14px}
.r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;
   border-bottom:1px solid #222c38;align-items:baseline}
.k{font-weight:600}.n{font-size:12px;color:#8b98a8;display:block;font-weight:400}
.v{font-family:ui-monospace,monospace;font-size:13px;white-space:nowrap}
.ok{color:#3ddc84}.no{color:#ff6b6b}.mb{color:#ffb454}
button{width:100%;padding:18px;font-size:18px;font-weight:700;border:none;
  border-radius:12px;background:#2b6cff;color:#fff;margin:18px 0}
button:disabled{background:#243039;color:#8b98a8}
#verdict{margin-top:20px;padding:16px;border-radius:10px;background:#161b22;line-height:1.5}
h2{font-size:15px;margin:22px 0 4px;color:#8b98a8;font-weight:600}
</style>
<h1>SixthSense device probe</h1>
<p class="s">Part 1 runs on load. Part 2 needs a tap — it starts a real AR
session, which is the only way to know what this phone actually grants.</p>

<h2>Part 1 — capabilities</h2>
<div id="out"></div>

<button id="go">Start AR session test</button>

<h2>Part 2 — live session</h2>
<div id="live"><p class="s">Not run yet.</p></div>

<div id="verdict">Run part 2 for a verdict.</div>

<script>
const out=document.getElementById('out');
const live=document.getElementById('live');
function row(t,k,note,v,cls){t.insertAdjacentHTML('beforeend',
  '<div class="r"><div class="k">'+k+'<span class="n">'+note+'</span></div>'+
  '<div class="v '+cls+'">'+v+'</div></div>')}
const yn=b=>b?['yes','ok']:['no','no'];

let arSupported=false, hrtf=false;

(async()=>{
  const sec=window.isSecureContext;
  row(out,'secure context','required for AR, camera, sensors, speech',...yn(sec));

  const hasXR=!!navigator.xr;
  row(out,'WebXR present','the API exists',...yn(hasXR));
  if(hasXR){try{arSupported=await navigator.xr.isSessionSupported('immersive-ar')}catch(e){}}
  row(out,'immersive-ar','ARCore 6-DoF tracking',...yn(arSupported));

  try{const c=new (window.AudioContext||window.webkitAudioContext)();
      const p=c.createPanner();p.panningModel='HRTF';hrtf=p.panningModel==='HRTF';c.close()}catch(e){}
  row(out,'Web Audio HRTF','your 4.2° result depends on this',...yn(hrtf));

  const sr=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  row(out,'speech input','asking out loud',...yn(sr));
  row(out,'speech output','spoken answers',...yn('speechSynthesis' in window));
  row(out,'vibration','haptic confirmations',...yn('vibrate' in navigator));
  row(out,'WebGPU','only matters if we add heavier models',...yn('gpu' in navigator));

  document.getElementById('go').disabled = !arSupported;
  if(!arSupported)document.getElementById('verdict').innerHTML=
    '<b class="no">No immersive-ar on this device.</b> Part 2 cannot run.';
})();

document.getElementById('go').onclick=async()=>{
  live.innerHTML='';
  const v=document.getElementById('verdict');
  v.textContent='Testing…';
  let s=null, depthOK=false, depthDetail='—', anchorsOK=false, floorOK=false;

  // Ask for everything optional, then report what was actually granted.
  try{
    s=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['local-floor'],
      optionalFeatures:['depth-sensing','anchors','hit-test','dom-overlay'],
      depthSensing:{usagePreference:['cpu-optimized','gpu-optimized'],
                    dataFormatPreference:['luminance-alpha','float32']}
    });
  }catch(e){
    live.innerHTML='<p class="s no">Session failed: '+e.message+'</p>';
    v.innerHTML='<b class="no">Could not start a session.</b> '+e.message;
    return;
  }

  const enabled = s.enabledFeatures || [];
  floorOK   = enabled.includes('local-floor');
  anchorsOK = enabled.includes('anchors');
  depthOK   = enabled.includes('depth-sensing');

  const space = await s.requestReferenceSpace('local-floor');

  await new Promise(res=>{
    let frames=0;
    s.requestAnimationFrame(function loop(t,frame){
      frames++;
      const pose=frame.getViewerPose(space);
      if(pose && depthOK){
        try{
          const di=frame.getDepthInformation(pose.views[0]);
          if(di){
            // normalised view coords, so 0.5,0.5 is the centre of the frame
            const m=di.getDepthInMeters(0.5,0.5);
            depthDetail=di.width+'×'+di.height+', centre '+m.toFixed(2)+' m';
          } else depthDetail='enabled but no data yet';
        }catch(e){depthDetail='error: '+e.name}
      }
      if(frames<40) s.requestAnimationFrame(loop); else res();
    });
  });

  row(live,'local-floor','origin on the floor; free eye height',...yn(floorOK));
  row(live,'depth-sensing','per-pixel distance, no trig needed',...yn(depthOK));
  row(live,'depth data',' resolution and a live centre reading',depthDetail,depthOK?'ok':'no');
  row(live,'anchors','drift-resistant object positions',...yn(anchorsOK));
  row(live,'dom-overlay','the HUD',...yn(enabled.includes('dom-overlay')));
  row(live,'granted','',enabled.join(', ')||'none','');

  await s.end();

  if(depthOK && anchorsOK){
    v.innerHTML='<b class="ok">Use ARCore depth.</b> This phone gives per-pixel '+
      'depth and anchors in the browser. Sample the depth map across the detection '+
      'box and take the median — drop the tan() trig, and objects above eye level '+
      'start working.';
  }else if(depthOK){
    v.innerHTML='<b class="ok">Use ARCore depth</b>, but no anchors — positions may '+
      'drift over a long session. Fine for a demo, re-verify before the run.';
  }else{
    v.innerHTML='<b class="mb">No depth on this device.</b> Keep the trig '+
      '(d = height ÷ tan of the down-angle). It works, it just needs the surface '+
      'height and cannot handle anything above eye level. Nothing else changes.';
  }
};
</script>
