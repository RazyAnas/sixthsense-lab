<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SixthSense — device probe</title>
<style>
body{font:16px system-ui;background:#0d1117;color:#e6edf5;margin:0;padding:20px}
h1{font-size:20px;margin:0 0 4px}p.s{color:#8b98a8;margin:0 0 18px;font-size:14px}
.r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;
   border-bottom:1px solid #222c38;align-items:baseline}
.k{font-weight:600}.n{font-size:12px;color:#8b98a8;display:block;font-weight:400}
.v{font-family:ui-monospace,monospace;font-size:13px;white-space:nowrap}
.ok{color:#3ddc84}.no{color:#ff6b6b}.mb{color:#ffb454}
#verdict{margin-top:20px;padding:16px;border-radius:10px;background:#161b22;line-height:1.5}
</style>
<h1>SixthSense device probe</h1>
<p class="s">One tap. Tells us whether to stay on the web or move to native Android.</p>
<div id="out"></div>
<div id="verdict">Running…</div>
<script>
const out=document.getElementById('out');
function row(k,note,v,cls){out.insertAdjacentHTML('beforeend',
  '<div class="r"><div class="k">'+k+'<span class="n">'+note+'</span></div>'+
  '<div class="v '+cls+'">'+v+'</div></div>')}
const yes=b=>b?['yes','ok']:['no','no'];

(async()=>{
  let xr=false, ar=false, depth=false, anchors=false;

  const hasXR=!!navigator.xr;
  row('WebXR present','the API exists at all',...yes(hasXR));
  if(hasXR){
    try{ar=await navigator.xr.isSessionSupported('immersive-ar')}catch(e){}
  }
  row('immersive-ar','ARCore 6-DoF position tracking — the one that matters',...yes(ar));

  // Feature support can only be confirmed by actually requesting a session,
  // but we can at least report whether the constructors exist.
  depth = typeof XRDepthInformation!=='undefined';
  anchors = typeof XRAnchor!=='undefined';
  row('depth-sensing','distance without the tan() trick',...yes(depth));
  row('anchors','drift-resistant object positions',...yes(anchors));

  const sec=window.isSecureContext;
  row('secure context','sensors and camera need https or localhost',...yes(sec));

  const so=typeof DeviceOrientationEvent!=='undefined';
  row('orientation sensor','head tracking — already working for you',...yes(so));

  const sr=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  row('speech input','asking out loud',...yes(sr));

  let hrtf=false;
  try{const c=new (window.AudioContext||window.webkitAudioContext)();
      const p=c.createPanner();p.panningModel='HRTF';hrtf=p.panningModel==='HRTF';c.close()}catch(e){}
  row('Web Audio HRTF','your 4.2° result depends on this',...yes(hrtf));

  row('user agent','',navigator.userAgent.slice(0,42)+'…','');

  const v=document.getElementById('verdict');
  if(ar&&hrtf){v.innerHTML='<b class="ok">Stay on the web.</b> This phone gives you '+
    'ARCore position tracking through WebXR <i>and</i> the audio engine your results '+
    'came from. Native Android would cost days and buy nothing.';}
  else if(hrtf&&!ar){v.innerHTML='<b class="mb">Web works, but you cannot walk.</b> '+
    'Audio is fine; no ARCore through the browser on this device. Either accept the '+
    'fixed standing spot for the demo, or move to native Android and rebuild the '+
    'audio layer. That rebuild is the real cost.';}
  else{v.innerHTML='<b class="no">Native Android.</b> The browser on this device is '+
    'missing what the product needs.';}
})();
</script>
